<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapids Rafting for reservations, inquiries, trip questions, and website feedback.">
    <meta name="author" content="Ezekiel Ogbebor-Jegede">
    <title>Contact Us | Rapids White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rapids.jpeg" alt="Rapids Rafting logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">

        <section class="company-info">
            <h1>Rapids Rafting</h1>
            <p>123 River Canyon Road</p>
            <p>Rapids Valley, CO 80435</p>
            <p>+1 (555) 123-4567</p>
            <p>info@rapidsrafting.com</p>
        </section>

        <section class="contact-layout">

            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0863929955967!2d-122.41941568468124!3d37.77492977975995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064d8f2d5b7%3A0x7b7b7b7b7b7b7b7b!2sSan%20Francisco!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form">

                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>

                <div class="message-purpose">
                    <p><strong>Message Purpose</strong></p>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Reservations Manager">
                    <figcaption>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer Experience Coordinator">
                    <figcaption>Customer Experience Coordinator</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rapids Rafting | Ezekiel Ogbebor-Jegede</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
